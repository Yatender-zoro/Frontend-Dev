<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Design Principles</title>
<link rel="stylesheet" href="q9.css">
</head>
<body>

<h2>Responsive Design Principles</h2>

<div class="grid">
  <div class="box">
    <h3>Fluid Layouts</h3>
    <p>Use flexible width instead of fixed px.</p>
    <code>width: 100%;</code>
  </div>

  <div class="box">
    <h3>Flexible Media</h3>
    <p>Images scale with container size.</p>
    <code>img { max-width: 100%; }</code>
  </div>

  <div class="box">
    <h3>Breakpoints</h3>
    <p>Adjust layout at specific widths.</p>
    <code>@media (max-width:600px){ ... }</code>
  </div>
</div>

</body>
</html>
