<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive CSS Cheat Sheet</title>
<link rel="stylesheet" href="q6.css">
</head>
<body>

<h1>Responsive CSS Cheat Sheet</h1>

<div class="grid">

  <div class="box">
    <div class="title">Filters</div>
    <p>Example: <code>filter: grayscale(100%);</code></p>
  </div>

  <div class="box">
    <div class="title">Media Queries</div>
    <p><code>@media (max-width: 700px){ ... }</code></p>
  </div>

  <div class="box">
    <div class="title">Responsive Design</div>
    <p>Use Flexbox/Grid + %/fr units instead of fixed px.</p>
  </div>

  <div class="box">
    <div class="title">Typography</div>
    <p><code>font-size: clamp(1rem, 3vw, 2.5rem);</code></p>
  </div>

</div>

</body>
</html>
