<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Image Filter Gallery</title>
<link rel="stylesheet" href="q1.css">
</head>

<body>
<h2>Image Filter Gallery</h2>

<div class="gallery">
  <div class="item blur">
    <img src="https://picsum.photos/400/300?1">
    <p>Blur</p>
  </div>

  <div class="item gray">
    <img src="https://picsum.photos/400/300?2">
    <p>Grayscale</p>
  </div>

  <div class="item sepia">
    <img src="https://picsum.photos/400/300?3">
    <p>Sepia</p>
  </div>

  <div class="item bright">
    <img src="https://picsum.photos/400/300?4">
    <p>Brightness</p>
  </div>

  <div class="item contrast">
    <img src="https://picsum.photos/400/300?5">
    <p>Contrast</p>
  </div>

  <div class="item hue">
    <img src="https://picsum.photos/400/300?6">
    <p>Hue Rotate</p>
  </div>
</div>

</body>
</html>
